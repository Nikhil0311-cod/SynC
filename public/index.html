// ---------------------------------------------------------------------------
// Helper for Authenticated Requests
// ---------------------------------------------------------------------------
async function apiFetch(url, options = {}) {
  const token = localStorage.getItem("token");
  const isFormData = options.body instanceof FormData;

  const headers = {
    ...(isFormData ? {} : { "Content-Type": "application/json" }),
    ...(token ? { "Authorization": `Bearer ${token}` } : {}),
    ...options.headers,
  };

  const res = await fetch(url, { ...options, headers });
  if (res.status === 401) {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    window.location.reload();
  }
  return res;
}

  );
}

function formatDate(sqliteTimestamp) {
  if (!sqliteTimestamp) return "";
  const d = new Date(sqliteTimestamp.replace(" ", "T") + "Z");
  if (isNaN(d.getTime())) return sqliteTimestamp;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

const inputClass = "w-full rounded-lg bg-slate-50 border border-slate-300 px-3 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition";
const labelClass = "block text-xs font-semibold text-slate-700 mb-1.5";

// ---------------------------------------------------------------------------
// Auth Modal Component
// ---------------------------------------------------------------------------
function AuthModal({ onLoginSuccess }) {
  const [isRegister, setIsRegister] = useState(false);
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [name, setName] = useState("");
  const [avatar, setAvatar] = useState(null);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setError("");
    setLoading(true);

    const endpoint = isRegister ? "/auth/register" : "/auth/login";

    try {
      let res;
      if (isRegister) {
        const formData = new FormData();
        formData.append("email", email);
        formData.append("password", password);
        formData.append("name", name);
        if (avatar) formData.append("avatar", avatar);

        res = await fetch(endpoint, {
          method: "POST",
          body: formData,
        });
      } else {
        res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
      }

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Authentication failed.");

      localStorage.setItem("token", data.token);
      localStorage.setItem("user", JSON.stringify(data.user));
      onLoginSuccess(data.user);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
      <form onSubmit={handleSubmit} className="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl space-y-4">
        <h2 className="text-xl font-bold text-slate-900">{isRegister ? "Create SynC Account" : "Welcome Back"}</h2>
        
        {isRegister && (
          <>
            <div>
              <label className={labelClass}>Full Name</label>
              <input required type="text" value={name} onChange={(e) => setName(e.target.value)} className={inputClass} placeholder="Jane Doe" />
            </div>
            <div>
              <label className={labelClass}>Profile Picture (Optional)</label>
              <input type="file" accept="image/*" onChange={(e) => setAvatar(e.target.files[0])} className={inputClass} />
            </div>
          </>
        )}

        <div>
          <label className={labelClass}>Email Address</label>
          <input required type="text" value={email} onChange={(e) => setEmail(e.target.value)} className={inputClass} placeholder="student@campus.edu or admin" />
        </div>

        <div>
          <label className={labelClass}>Password</label>
          <input required type="password" value={password} onChange={(e) => setPassword(e.target.value)} className={inputClass} placeholder="••••••••" />
        </div>

        {error && <p className="text-xs text-red-600 font-medium">{error}</p>}

        <button type="submit" disabled={loading} className="w-full py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm transition shadow-md">
          {loading ? "Processing..." : isRegister ? "Sign Up" : "Log In"}
        </button>

        <p className="text-xs text-center text-slate-500 pt-2">
          {isRegister ? "Already have an account?" : "Don't have an account?"}{" "}
          <button type="button" onClick={() => setIsRegister(!isRegister)} className="text-blue-600 font-semibold underline">
            {isRegister ? "Log In" : "Register"}
          </button>
        </p>
      </form>
    </div>
  );
}

function PollList({ items, onDelete, onVote, currentUser }) {
  return (
    <div className="grid sm:grid-cols-2 gap-4">
      {items.map((p) => {
        const total = p.options.reduce((sum, o) => sum + o.votes, 0);
        return (
          <div key={p.id} className="group relative rounded-xl border border-slate-200 bg-white p-5 shadow-sm hover:shadow-md transition">
            {(currentUser?.role === "admin" || (currentUser && currentUser.id === p.user_id)) && (
              <button onClick={() => onDelete("polls", p.id)} className="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition text-slate-400 hover:text-red-600">
                <IconTrash className="w-4 h-4" />
              </button>
            )}
            <h3 className="font-semibold text-slate-900 pr-6">{p.question}</h3>
            <p className="text-xs text-slate-400 mt-1 mb-4">{total} vote{total === 1 ? "" : "s"} · {formatDate(p.created_at)}</p>
            <div className="space-y-2.5">
              {p.options.map((o, i) => {
                const pct = total > 0 ? Math.round((o.votes / total) * 100) : 0;
                return (
                  <button key={i} onClick={() => onVote(p.id, i)} className="w-full text-left hover:opacity-90 transition">
                    <div className="flex items-center justify-between text-sm mb-1">
                      <span className="text-slate-700 font-medium">{o.text}</span>
                      <span className="text-slate-500 text-xs font-semibold">{pct}%</span>
                    </div>
                    <div className="h-2 rounded-full bg-slate-100 overflow-hidden border border-slate-200/60">
                      <div className="h-full rounded-full bg-blue-600 transition-all duration-300" style={{ width: pct + "%" }}></div>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function TabContent({ tab, items, onDelete, onVote, currentUser, onDeleteUser }) {
  if (tab === "users") return <UserDirectory users={items} onDeleteUser={onDeleteUser} currentUser={currentUser} />;
  if (!items || items.length === 0) return <div className="rounded-2xl border border-dashed border-slate-300 bg-white py-20 text-center text-slate-500 text-sm">No items posted yet.</div>;
  if (tab === "announcements") return <AnnouncementList items={items} onDelete={onDelete} currentUser={currentUser} />;
  if (tab === "materials") return <MaterialsGrid items={items} onDelete={onDelete} currentUser={currentUser} />;
  if (tab === "polls") return <PollList items={items} onDelete={onDelete} onVote={onVote} currentUser={currentUser} />;
  return <LostFoundGrid items={items} onDelete={onDelete} currentUser={currentUser} />;
}

// ---------------------------------------------------------------------------
// Add Modal Component
// ---------------------------------------------------------------------------
function AddModal({ tab, onClose, onAdded, currentUser }) {
  const [form, setForm] = useState(() => {
    if (tab === "announcements") return { title: "", body: "", category: "General" };
    if (tab === "materials") return { name: "", course: "", description: "" };
    if (tab === "polls") return { question: "", options: "" };
    return { item_name: "", description: "", status: "lost", location: "" };
  });
  const [file, setFile] = useState(null);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  const update = (field, value) => setForm((prev) => ({ ...prev, [field]: value }));

  async function submit(e) {
    e.preventDefault();
    setSaving(true);
    setError("");
    try {
      let body;

      if (tab === "materials") {
        if (!file) throw new Error("Please select a file to upload.");
        const formData = new FormData();
        formData.append("name", form.name);
        formData.append("course", form.course);
        formData.append("description", form.description);
        formData.append("file", file);
        body = formData;
      } else {
        let payload = { ...form };
        if (tab === "polls") {
          const opts = form.options.split(",").map((s) => s.trim()).filter(Boolean);
          if (opts.length < 2) throw new Error("Add at least two options, separated by commas.");
          payload = { question: form.question, options: opts };
        }
        body = JSON.stringify(payload);
      }

      const res = await apiFetch("/" + tab, {
        method: "POST",
        body,
      });

      const json = await res.json();
      if (!res.ok) throw new Error(json.error || "Something went wrong.");
      onAdded(tab, json);
      onClose();
    } catch (err) {
      setError(err.message);
    } finally {
      setSaving(false);
    }
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
      <form onSubmit={submit} className="relative w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl">
        <div className="flex items-center justify-between mb-5">
          <h2 className="text-lg font-semibold text-slate-900">Add Entry</h2>
          <button type="button" onClick={onClose} className="text-slate-400 hover:text-slate-600 transition"><IconX className="w-5 h-5" /></button>
        </div>

        {tab === "announcements" && (
          <div className="space-y-4">
            <div><label className={labelClass}>Title</label><input required value={form.title} onChange={(e) => update("title", e.target.value)} className={inputClass} placeholder="e.g. Library hours extended" /></div>
            <div>
              <label className={labelClass}>Category</label>
              <select value={form.category} onChange={(e) => update("category", e.target.value)} className={inputClass}>
                <option>General</option><option>Academics</option><option>Events</option><option>Sports</option><option>Placement</option>
              </select>
            </div>
            <div><label className={labelClass}>Details</label><textarea required rows="4" value={form.body} onChange={(e) => update("body", e.target.value)} className={inputClass} placeholder="What do students need to know?"></textarea></div>
          </div>
        )}

        {tab === "materials" && (
          <div className="space-y-4">
            <div><label className={labelClass}>Material Name</label><input required value={form.name} onChange={(e) => update("name", e.target.value)} className={inputClass} placeholder="e.g. Midterm Lecture Notes" /></div>
            <div><label className={labelClass}>Course Code</label><input required value={form.course} onChange={(e) => update("course", e.target.value)} className={inputClass} placeholder="e.g. CS101" /></div>
            <div><label className={labelClass}>Description (Optional)</label><textarea rows="3" value={form.description} onChange={(e) => update("description", e.target.value)} className={inputClass} placeholder="Brief summary of the document..."></textarea></div>
            <div><label className={labelClass}>Attachment File</label><input required type="file" onChange={(e) => setFile(e.target.files[0])} className={inputClass} /></div>
          </div>
        )}

        {tab === "polls" && (
          <div className="space-y-4">
            <div><label className={labelClass}>Question</label><input required value={form.question} onChange={(e) => update("question", e.target.value)} className={inputClass} placeholder="e.g. Best spot for the fest?" /></div>
            <div><label className={labelClass}>Options</label><input required value={form.options} onChange={(e) => update("options", e.target.value)} className={inputClass} placeholder="e.g. Quad, Auditorium, Ground" /><p className="text-xs text-slate-500 mt-1.5">Comma separated.</p></div>
          </div>
        )}

        {tab === "lost-found" && (
          <div className="space-y-4">
            <div><label className={labelClass}>Item</label><input required value={form.item_name} onChange={(e) => update("item_name", e.target.value)} className={inputClass} placeholder="e.g. Black umbrella" /></div>
            <div className="grid grid-cols-2 gap-3">
              <div><label className={labelClass}>Status</label><select value={form.status} onChange={(e) => update("status", e.target.value)} className={inputClass}><option value="lost">Lost</option><option value="found">Found</option></select></div>
              <div><label className={labelClass}>Location</label><input value={form.location} onChange={(e) => update("location", e.target.value)} className={inputClass} placeholder="e.g. Main gate" /></div>
            </div>
            <div><label className={labelClass}>Description</label><textarea rows="3" value={form.description} onChange={(e) => update("description", e.target.value)} className={inputClass} placeholder="Identifying details"></textarea></div>
          </div>
        )}

        {error && <p className="text-sm text-red-600 font-medium mt-3">{error}</p>}

        <div className="flex justify-end gap-3 mt-6">
          <button type="button" onClick={onClose} className="px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition text-sm font-medium">Cancel</button>
          <button type="submit" disabled={saving} className="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white disabled:opacity-50 transition font-medium text-sm shadow-md">{saving ? "Saving…" : "Save"}</button>
        </div>
      </form>
    </div>
  );
}

// ---------------------------------------------------------------------------
// App Shell
// ---------------------------------------------------------------------------
function App() {
  const [user, setUser] = useState(() => {
    const saved = localStorage.getItem("user");
    return saved ? JSON.parse(saved) : null;
  });
  const [activeTab, setActiveTab] = useState("announcements");
  const [items, setItems] = useState({ announcements: [], materials: [], polls: [], "lost-found": [], users: [] });
  const [loading, setLoading] = useState(true);
  const [modalOpen, setModalOpen] = useState(false);

  useEffect(() => {
    if (!user) return;
    (async () => {
      setLoading(true);
      try {
        const fetches = [
          apiFetch("/announcements").then((r) => r.json()),
          apiFetch("/materials").then((r) => r.json()),
          apiFetch("/polls").then((r) => r.json()),
          apiFetch("/lost-found").then((r) => r.json()),
        ];
        
        if (user.role === "admin") {
          fetches.push(apiFetch("/admin/users").then((r) => r.json()));
        }

        const [announcements, materials, polls, lostFound, users] = await Promise.all(fetches);
        setItems({
          announcements: Array.isArray(announcements) ? announcements : [],
          materials: Array.isArray(materials) ? materials : [],
          polls: Array.isArray(polls) ? polls : [],
          "lost-found": Array.isArray(lostFound) ? lostFound : [],
          users: Array.isArray(users) ? users : [],
        });
      } catch (e) {
        console.error("Failed to load dashboard data", e);
      } finally {
        setLoading(false);
      }
    })();
  }, [user]);

  async function handleAvatarUpdate(e) {
    const file = e.target.files[0];
    if (!file) return;

    const formData = new FormData();
    formData.append("avatar", file);

    try {
      const res = await apiFetch("/users/me/avatar", {
        method: "POST",
        body: formData,
      });

      if (!res.ok) throw new Error("Avatar upload failed.");
      const updatedUser = await res.json();

      setUser(updatedUser);
      localStorage.setItem("user", JSON.stringify(updatedUser));
    } catch (err) {
      alert(err.message);
    }
  }

  async function handleDelete(tab, id) {
    try {
      const res = await apiFetch(`/${tab}/${id}`, { method: "DELETE" });
      if (!res.ok && res.status !== 204) throw new Error("Failed to remove.");
      setItems((prev) => ({ ...prev, [tab]: prev[tab].filter((i) => i.id !== id) }));
    } catch (e) {
      alert(e.message);
    }
  }

  async function handleDeleteUser(userId) {
    if (!confirm("Are you sure you want to remove this user?")) return;
    try {
      const res = await apiFetch(`/admin/users/${userId}`, { method: "DELETE" });
      if (!res.ok && res.status !== 204) throw new Error("Failed to delete user.");
      setItems((prev) => ({ ...prev, users: prev.users.filter((u) => u.id !== userId) }));
    } catch (e) {
      alert(e.message);
    }
  }

  async function handleVote(pollId, optionIndex) {
    try {
      const res = await apiFetch(`/polls/${pollId}/vote`, {
        method: "POST",
        body: JSON.stringify({ optionIndex }),
      });
      if (!res.ok) throw new Error("Vote failed.");
      const updated = await res.json();
      setItems((prev) => ({ ...prev, polls: prev.polls.map((p) => (p.id === updated.id ? updated : p)) }));
    } catch (e) {
      alert(e.message);
    }
  }

  function handleLogout() {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    setUser(null);
  }

  if (!user) {
    return <AuthModal onLoginSuccess={(u) => setUser(u)} />;
  }

  const visibleTabs = TABS.filter((t) => !t.adminOnly || user.role === "admin");
  const meta = TAB_META[activeTab] || {};

  return (
    <div className="relative min-h-screen flex text-slate-900">
      <aside className="fixed left-0 top-0 h-screen w-64 flex flex-col border-r border-slate-200 bg-white/80 backdrop-blur-2xl z-20">
        <div className="px-6 py-6 border-b border-slate-100 flex items-center justify-between">
          <div>
            <div className="flex items-center gap-2">
              <span className="w-2.5 h-2.5 rounded-full bg-blue-600 shadow-[0_0_8px_1px_rgba(37,99,235,0.4)]"></span>
              <span className="text-xl font-bold tracking-tight text-slate-900">SynC</span>
            </div>
            <p className="text-xs text-slate-400 mt-0.5">Campus Console</p>
          </div>
        </div>

        <nav className="flex-1 px-3 py-4 space-y-1">
          {visibleTabs.map((t) => {
            const Icon = t.icon;
            const active = activeTab === t.id;
            return (
              <button
                key={t.id}
                onClick={() => setActiveTab(t.id)}
                className={"w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition font-medium " + (active ? "bg-blue-50 border border-blue-200 text-blue-700" : "text-slate-600 hover:text-slate-900 hover:bg-slate-100/70")}
              >
                <Icon className="w-4 h-4 shrink-0" />
                <span className="flex-1 text-left">{t.label}</span>
                <span className="text-xs rounded-full px-2 py-0.5 font-semibold bg-slate-100 text-slate-500">{(items[t.id] || []).length}</span>
              </button>
            );
          })}
        </nav>

        <div className="p-4 border-t border-slate-100 flex items-center justify-between">
          <div className="flex items-center gap-3 min-w-0">
            <div className="relative group cursor-pointer shrink-0">
              <UserAvatar user={user} className="w-8 h-8 text-xs" />
              <input
                type="file"
                accept="image/*"
                onChange={handleAvatarUpdate}
                className="absolute inset-0 opacity-0 cursor-pointer"
                title="Change profile picture"
              />
            </div>
            <div className="min-w-0">
              <p className="text-xs font-semibold text-slate-900 truncate">{user.name}</p>
              <p className="text-[10px] text-slate-400 truncate">{user.email}</p>
            </div>
          </div>
          <button onClick={handleLogout} className="text-slate-400 hover:text-red-600 p-1.5 transition"><IconLogOut className="w-4 h-4" /></button>
        </div>
      </aside>

      <main className="flex-1 ml-64 min-h-screen">
        <header className="sticky top-0 z-10 border-b border-slate-200 bg-slate-50/80 backdrop-blur-xl px-8 py-6 flex items-center justify-between">
          <div>
            <h1 className="text-2xl font-bold text-slate-900 tracking-tight">{TABS.find((t) => t.id === activeTab)?.label}</h1>
            <p className="text-sm text-slate-500 mt-0.5">{meta.subtitle}</p>
          </div>
          {meta.addLabel && (
            <button onClick={() => setModalOpen(true)} className="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium transition shadow-md">
              <IconPlus className="w-4 h-4" />
              {meta.addLabel}
            </button>
          )}
        </header>

        <div className="px-8 py-8 max-w-5xl">
          {loading ? (
            <div className="flex justify-center py-24"><div className="w-6 h-6 rounded-full border-2 border-blue-600/30 border-t-blue-600 animate-spin"></div></div>
          ) : (
            <TabContent tab={activeTab} items={items[activeTab]} onDelete={handleDelete} onVote={handleVote} currentUser={user} onDeleteUser={handleDeleteUser} />
          )}
        </div>
      </main>

      {modalOpen && <AddModal tab={activeTab} onClose={() => setModalOpen(false)} onAdded={(t, row) => setItems((p) => ({ ...p, [t]: [row, ...p[t]] }))} currentUser={user} />}
    </div>
  );
}

const container = document.getElementById("root");
const root = ReactDOM.createRoot(container);
root.render(<App />);
</script>
</body>
</html>
